name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # A single local Postgres service container backs every step below —
  # integration tests never touch the Supabase projects (docs/09 §20).
  # Razorpay is always mocked (an injectable fetchImpl, docs/09 §20), so its
  # two vars below are harmless placeholders — no test calls the real
  # Razorpay API. R2 and Resend are different: tests/integration/
  # media-uploads.test.ts and notifications.test.ts deliberately call the
  # *real* R2 bucket and the *real* Resend API (same "verify against real
  # infrastructure" discipline as everything else, docs/09 §20) — there's
  # no good local emulator for either. That means R2_*/RESEND_API_KEY/
  # EMAIL_FROM below must be real values, not placeholders, or those two
  # test files fail here. Add them as repo secrets (Settings -> Secrets and
  # variables -> Actions) — same dev credentials already in .env.local, or
  # CI-scoped equivalents — then this comment's TODO is done:
  # TODO(owner): add repo secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
  # R2_SECRET_ACCESS_KEY, R2_BUCKET, RESEND_API_KEY, CI_EMAIL_FROM.
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/india_kitsch
  DATABASE_URL_SESSION: postgres://postgres:postgres@localhost:5432/india_kitsch
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/india_kitsch
  BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-real
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_IMAGE_BASE_URL: http://localhost:3000/images
  EMAIL_FROM: ${{ secrets.CI_EMAIL_FROM || 'orders@example.com' }}
  # No test sends through authEmailSender against a real inbox (unlike
  # EMAIL_FROM/emailSender via notifications.test.ts), so this only needs
  # to satisfy env.ts's z.email() check — a plain placeholder is fine.
  SUPPORT_EMAIL_FROM: support@example.com
  CONTACT_INBOX_EMAIL: hello@example.com
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || 'ci-placeholder' }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || 'ci-placeholder' }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || 'ci-placeholder' }}
  R2_BUCKET: ${{ secrets.R2_BUCKET || 'ci-placeholder' }}
  CRON_SECRET: ci-only-placeholder-secret-not-used-anywhere-real
  RAZORPAY_KEY_SECRET: ci-placeholder
  NEXT_PUBLIC_RAZORPAY_KEY_ID: ci-placeholder
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-placeholder' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: india_kitsch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Migration 0001 (RLS lockdown) grants/revokes privileges from
      # Supabase's anon/authenticated roles so the same migration files
      # apply unchanged everywhere (docs/03 §4 "Portability note") — a
      # vanilla Postgres service container needs stand-in roles first, the
      # same ones compose.yaml's local-db-init.sql creates for local dev.
      - name: Create Supabase-equivalent roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d india_kitsch \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;"

      - run: npm run lint

      - run: npm run typecheck

      - name: Apply migrations
        run: npx tsx tests/setup/migrate-test-db.ts

      - run: npm run test

      - run: npm run build
